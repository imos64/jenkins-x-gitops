apiVersion: core.jenkins-x.io/v4beta1
kind: Requirements
spec:
  autoUpdate:
    enabled: false
    schedule: ''
  cluster:
    chartRepository: http://bucketrepo.jx.svc.cluster.local/bucketrepo/charts
    clusterName: REPLACE_CLUSTER_NAME
    devEnvApprovers:
    - imos64
    environmentGitOwner: imos64
    gitKind: github
    gitName: github
    gitServer: https://github.com
    provider: kubernetes
    registry: ghcr.io
  environments:
  - key: dev
  - key: staging
  - key: production
  ingress:
    domain: REPLACE_CLUSTER_DOMAIN
    externalDNS: false
    namespaceSubDomain: -jx.
    tls:
      email: REPLACE_ACME_EMAIL
      enabled: true
      production: false
  repository: bucketrepo
  secretStorage: local
  vault: {}
  webhook: lighthouse
