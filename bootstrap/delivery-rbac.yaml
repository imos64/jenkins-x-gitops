apiVersion: v1
kind: ServiceAccount
metadata:
  name: delivery-reconciler
  namespace: jx-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: delivery-reconciler
  namespace: jx-demo
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  - services
  - events
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: delivery-reconciler
  namespace: jx-demo
subjects:
- kind: ServiceAccount
  name: delivery-reconciler
  namespace: jx-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: delivery-reconciler
